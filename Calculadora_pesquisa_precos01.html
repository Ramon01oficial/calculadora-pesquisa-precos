<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Pesquisa de Preços - IN 65/2021</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Calculadora de Pesquisa de Preços</h2>
    <span class="subtit">Conforme IN SEGES/ME Nº 65/2021</span>

    <div class="form-group">
      <label>Tabela de Preços Obtidos:</label>
      <table id="tabelaPrecos">
        <thead>
          <tr>
            <th style="width: 5%;">Nº</th>
            <th style="width: 30%;">Fornecedor</th>
            <th style="width: 18%;">CNPJ</th>
            <th style="width: 12%;">Tipo</th>
            <th style="width: 13%;">Valor (R$)</th>
            <th style="width: 14%;">Status / Expurgo</th>
            <th style="width: 8%;">Ação</th>
          </tr>
        </thead>
        <tbody id="corpoTabela">
          <!-- Linhas geradas dinamicamente via JS -->
        </tbody>
      </table>
      <button type="button" id="btnAdicionar" class="btn-secundario">+ Adicionar Fornecedor</button>
    </div>

    <div class="legenda-box">
      <span class="legenda-item legenda-red">■ Excluído na primeira análise (Inexequível / Excessivo)</span><br>
      <span class="legenda-item legenda-blue">■ Excluído na segunda análise (Ajuste Técnico / Outlier)</span>
    </div>

    <button type="button" id="btnCalcular">Calcular e Validar Pesquisa</button>

    <div id="resultado" class="result-box" style="display:none;"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
